<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ניהול · מניין הצעירים</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cmsusfmwjtpfewbydzpi.supabase.co; font-src 'self'; connect-src 'self' https://cmsusfmwjtpfewbydzpi.supabase.co; form-action 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#12233F">
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="preload" href="fonts/frank-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/main.css?v=20">
<link rel="stylesheet" href="css/admin.css?v=20">
</head>
<body class="adm">

<!-- ══ מסך כניסה ══ -->
<div class="gate" id="gate">
  <form class="gate-box" id="loginForm" autocomplete="on">
    <img src="img/mark@64.png" alt="" width="44" height="44">
    <div class="eyebrow">אזור ניהול</div>
    <h1>מניין הצעירים</h1>
    <p class="sub">הכניסה מוגבלת לגבאים. אין כאן דבר שנגיש לציבור.</p>

    <label class="fld"><span>כתובת מייל</span>
      <input id="lgEmail" type="email" inputmode="email" autocomplete="username" required></label>
    <label class="fld"><span>סיסמה</span>
      <input id="lgPass" type="password" autocomplete="current-password" required></label>

    <button class="btn btn-g wide" id="lgBtn" type="submit">כניסה</button>
    <p class="hint" id="lgHint"></p>
  </form>
</div>

<!-- ══ הפאנל ══ -->
<div id="panel" hidden>

  <header class="top">
    <div class="wrap">
      <a class="brand" href="./">
        <img src="img/mark@64.png" alt="" width="30" height="30">
        <b>ניהול<span class="dot"> · </span><span class="pl">מניין הצעירים</span></b>
      </a>
      <nav class="nav">
        <a href="./">לאתר</a>
        <span class="who" id="who"></span>
        <button type="button" class="btn btn-s small" id="logout">יציאה</button>
      </nav>
    </div>
  </header>

  <main class="wrap adm-main">

    <!-- דיווחים -->
    <section class="adm-sec">
      <div class="head">
        <div class="eyebrow">מבט על</div>
        <h2>דיווחים</h2>
      </div>
      <div class="cards" id="stats"></div>
    </section>

    <!-- רישומים -->
    <section class="adm-sec">
      <div class="head">
        <div class="eyebrow">אישורים</div>
        <h2>רישומים</h2>
        <p>כל מה שנרשם באתר מגיע לכאן. אישור או דחייה נשמרים מיד.</p>
      </div>

      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <input type="search" id="q" placeholder="חיפוש שם, טלפון או פריט…" aria-label="חיפוש">
      </div>

      <div id="rows"></div>
      <p class="note" id="rowsNote"></p>
      <button type="button" class="btn btn-s" id="more" hidden>עוד רישומים</button>
    </section>

    <!-- חדשות -->
    <section class="adm-sec" id="newsSec">
      <div class="head">
        <div class="eyebrow">ישר ולעניין</div>
        <h2>חדשות היישוב</h2>
        <p>הודעות שנאספו מקבוצת המייל, ממתינות לאישור לפני שהן מופיעות באתר.</p>
      </div>
      <div class="toolbar"><div class="filters" id="newsFilters"></div></div>
      <div id="news"></div>
      <p class="note" id="newsNote"></p>
    </section>

  </main>

  <footer>
    <div class="wrap">
      <div class="foot-bot" style="border:0;padding-top:0">
        <span><a href="./">← לאתר</a></span>
        <span id="build"></span>
      </div>
    </div>
  </footer>
</div>

<script src="js/admin.js?v=20"></script>
</body>
</html>
