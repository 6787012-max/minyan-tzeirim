<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מודעה</title>
<style>
/* מודעה לתלייה על לוח בבית הכנסת ולשליחה בוואטסאפ.
   פורמט אחד לשניהם: יחס A4 לאורך, שנקרא גם כתמונה בטלפון.
   הפונטים מוטמעים כקבצים מקומיים — אין רשת בזמן הרינדור. */
@font-face { font-family:'Frank'; src:url('../fonts/frank-medium.woff2') format('woff2'); font-weight:500; }
@font-face { font-family:'Frank'; src:url('../fonts/frank-black.woff2') format('woff2'); font-weight:900; }
@font-face { font-family:'Asst';  src:url('../fonts/assistant-regular.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'Asst';  src:url('../fonts/assistant-semibold.woff2') format('woff2'); font-weight:600; }
@font-face { font-family:'Asst';  src:url('../fonts/assistant-extrabold.woff2') format('woff2'); font-weight:800; }
@font-face { font-family:'Num';   src:url('../fonts/heebo-black.woff2') format('woff2'); font-weight:900; }

:root {
  --navy:#12233F; --gold:#B08D3E; --cream:#FBF8F3; --cream2:#F4EFE6;
  --line:#E3D9C8; --muted:#6b6257; --ink:#3d3830;
}
* { box-sizing:border-box; margin:0; padding:0; }
@page { size:A4 portrait; margin:0; }
html,body { width:210mm; height:297mm; }
body {
  font-family:'Asst',sans-serif; background:var(--cream); color:var(--ink);
  display:flex; flex-direction:column; position:relative; overflow:hidden;
}

/* מסגרת זהב דקה — נותנת למודעה נוכחות על לוח עמוס */
.frame {
  position:absolute; inset:9mm; border:1.6px solid var(--gold);
  border-radius:3mm; pointer-events:none;
}
.frame::after {
  content:''; position:absolute; inset:2.6mm;
  border:0.7px solid rgba(176,141,62,.42); border-radius:2mm;
}

.inner {
  position:relative; z-index:1; flex:1;
  display:flex; flex-direction:column;
  padding:22mm 20mm 18mm;
}

/* ── כותרת עליונה ── */
.top { text-align:center; }
.mark { width:17mm; height:auto; margin:0 auto 4mm; display:block; opacity:.95; }
.brand {
  font-family:'Frank',serif; font-weight:900; font-size:15pt; color:var(--navy);
  letter-spacing:.01em;
}
.place { font-size:10.5pt; color:var(--muted); letter-spacing:.16em; margin-top:1.5mm; }
.rule {
  width:34mm; height:1.4px; background:var(--gold); margin:6mm auto 0; opacity:.75;
}

/* ── גוף ── */
.mid {
  flex:1; display:flex; flex-direction:column; justify-content:center;
  text-align:center;
  /* מודעת הודיה קצרה נדחפה נמוך מדי במרכוז מלא. משיכה קלה כלפי מעלה
     מיישרת אותה מול מודעת הזמנים, שממלאת את העמוד ממילא. */
  padding-bottom:6mm;
}
.eyebrow {
  font-size:11pt; letter-spacing:.22em; color:var(--gold);
  font-weight:600; margin-bottom:5mm;
}
h1 {
  font-family:'Frank',serif; font-weight:900; color:var(--navy);
  font-size:34pt; line-height:1.22; margin-bottom:5mm;
}
h1.long { font-size:27pt; }
.lead {
  font-family:'Frank',serif; font-weight:500; font-size:17pt;
  color:var(--gold); line-height:1.5; margin-bottom:9mm;
}
.body p {
  font-size:13.5pt; line-height:1.85; color:var(--ink);
  max-width:132mm; margin:0 auto 5mm;
}
.when {
  margin-top:8mm; display:inline-block; align-self:center;
  border:1.4px solid var(--gold); border-radius:2.4mm;
  padding:3.5mm 9mm; font-size:13pt; font-weight:600; color:var(--navy);
  background:rgba(176,141,62,.06);
}

/* ── טבלת זמנים ── */
.z-note {
  background:var(--navy); color:#fff; border-radius:2.4mm;
  padding:4mm 7mm; font-size:12pt; line-height:1.6; margin-bottom:7mm;
  text-align:center;
}
table { width:100%; border-collapse:collapse; font-size:11.5pt; }
thead th {
  font-size:9.5pt; letter-spacing:.06em; color:var(--muted); font-weight:600;
  padding:0 2mm 2.5mm; text-align:center; border-bottom:1.2px solid var(--gold);
}
thead th:first-child { text-align:start; }
tbody td { padding:3.4mm 2mm; border-bottom:1px solid var(--line); text-align:center; }
tbody tr:last-child td { border-bottom:0; }
td.day { text-align:start; }
td.day b {
  display:block; font-family:'Frank',serif; font-weight:900;
  font-size:13pt; color:var(--navy); line-height:1.3;
}
td.day span { font-size:9.5pt; color:var(--muted); }
.num { font-family:'Num','Asst',sans-serif; font-weight:900; font-size:13pt; color:var(--navy); }
.dash { color:var(--line); }
tr.hl td { background:rgba(176,141,62,.09); }
.foot-note {
  margin-top:6mm; font-size:9.5pt; color:var(--muted); line-height:1.6; text-align:center;
}

/* ── תחתית ── */
.bot { text-align:center; padding-top:7mm; border-top:1px solid var(--line); }
.bot .slogan {
  font-family:'Frank',serif; font-size:12.5pt; color:var(--navy); font-weight:500;
}
.bot .site { font-size:10pt; color:var(--muted); margin-top:2mm; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="inner">

  <div class="top">
    <img class="mark" src="../img/mark.svg" alt="">
    <div class="brand">מניין הצעירים</div>
    <div class="place">מעלה עמוס</div>
    <div class="rule"></div>
  </div>

  <div class="mid" id="mid"></div>

  <div class="bot">
    <div class="slogan" id="slogan">שנה טובה ומבורכת</div>
    <div class="site">minyan.mokad.co.il</div>
  </div>

</div>
</body>
</html>
