<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מודעה</title>
<style>
/* מודעה לתלייה על לוח בבית הכנסת ולשליחה בוואטסאפ.
   הגרסה הראשונה יצאה מינימליסטית מדי — הרבה לבן וקו דק — וזה לא
   הרגיסטר של מודעת הכרת הטוב בבית כנסת. כאן: מסגרת כפולה עם פינות
   מעוטרות, רקע בעל טקסטורה, כותרות בזהב מדורג, וכל עיטור מצויר
   ב-SVG מקומי כדי שהרינדור לא יהיה תלוי ברשת. */

/* פונטי הכותרות מגיעים מ-moda/fonts ולא מ-fonts של האתר: אלה
   פונטי דפוס עבריים מסורתיים (כתר, שופר, דרוגולין) שמתאימים
   למודעה על לוח בבית כנסת, ולא לממשק. */
@font-face { font-family:'Keter';  src:url('fonts/keteryg-bold-fixed.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Keter';  src:url('fonts/keteryg-medium-webfont.ttf') format('truetype'); font-weight:500; }
@font-face { font-family:'Shofar'; src:url('fonts/shofardemi-bold-webfont.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Drug';   src:url('fonts/drugulinclm-bold-webfont.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Stam';   src:url('fonts/stamashkenazclm-webfont.ttf') format('truetype'); font-weight:400; }
@font-face { font-family:'FrankB'; src:url('fonts/FrankRuhlLibre-Black.ttf') format('truetype'); font-weight:900; }
@font-face { font-family:'Frank'; src:url('../fonts/frank-medium.woff2') format('woff2'); font-weight:500; }
@font-face { font-family:'Frank'; src:url('../fonts/frank-black.woff2') format('woff2'); font-weight:900; }
@font-face { font-family:'Asst';  src:url('../fonts/assistant-regular.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'Asst';  src:url('../fonts/assistant-semibold.woff2') format('woff2'); font-weight:600; }
@font-face { font-family:'Asst';  src:url('../fonts/assistant-extrabold.woff2') format('woff2'); font-weight:800; }
@font-face { font-family:'Num';   src:url('../fonts/heebo-black.woff2') format('woff2'); font-weight:900; }

:root {
  --navy:#2A1416; --navy2:#4A2226; --navy3:#63313A;
  --gold:#B08D3E; --gold-l:#E3C883; --gold-d:#8A6B24;
  --cream:#FDFAF4; --cream2:#F6F0E4;
  --line:#E0D4BE; --muted:#6F6555; --ink:#3A342B;
}
* { box-sizing:border-box; margin:0; padding:0; }
@page { size:A4 portrait; margin:0; }
html,body { width:210mm; height:297mm; }

body {
  font-family:'Asst',sans-serif; color:var(--ink); position:relative;
  /* מסגרת מודפסת מספריית האיורים (מסגרות ועיטורים / שערים ספרים
     ונרות). יחס התמונה 1.396 מול 1.414 של A4 — הפרש של אחוז,
     ו-cover סוגר אותו בלי לעוות. */
  background-image:url('bg-frame.jpg');
  background-size:cover; background-position:center;
  overflow:hidden; display:flex; flex-direction:column;
  /* שכבות: הילה חמה מלמעלה, דוגמת יהלומים דהויה, ורקע שמנת */
}

/* ── מסגרת ── */
.edge {
  position:absolute; inset:7mm; border:2.2px solid var(--gold);
  border-radius:2mm; pointer-events:none;
}
.edge::after {
  content:''; position:absolute; inset:2.2mm;
  border:.8px solid rgba(176,141,62,.45); border-radius:1.4mm;
}
.corner { position:absolute; width:20mm; height:20mm; pointer-events:none; }
.corner img { width:100%; height:100%; display:block; }
.c-tr { top:8.4mm; right:8.4mm; }
.c-tl { top:8.4mm; left:8.4mm; transform:scaleX(-1); }
.c-br { bottom:8.4mm; right:8.4mm; transform:scaleY(-1); }
.c-bl { bottom:8.4mm; left:8.4mm; transform:scale(-1,-1); }

/* קרטושי אמצע — מסגרת מודפסת שוברת את הקו באמצע כל צלע.
   בלי זה המלבן נקרא כמו border ולא כמו מסגרת. */
.mid-t, .mid-b, .mid-r, .mid-l { position:absolute; pointer-events:none; z-index:1; }
.mid-t, .mid-b { width:8.5mm; left:50%; transform:translateX(-50%); }
.mid-t { top:3.4mm; }
.mid-b { bottom:3.4mm; }
.mid-r, .mid-l { width:8mm; top:50%; }
.mid-r { right:3.6mm; transform:translateY(-50%); }
.mid-l { left:3.6mm; transform:translateY(-50%); }

/* סימן מים — הלוגו עצמו, דהוי כמעט עד היעלמות. נותן לנייר עומק
   בלי להתחרות באף שורת טקסט. */
.wm {
  position:absolute; top:52%; left:50%; transform:translate(-50%,-50%);
  width:104mm; opacity:.03; z-index:0; pointer-events:none;
  filter:grayscale(1) brightness(.45);
}

  .panel { font-size:1em; }
  .inner {
  /* שטח הכתיבה מוגבל לפנל הקלף שבתוך המסגרת המודפסת. הקשת
     העליונה מכרסמת במרכז, ולכן הריפוד העליון נדיב יותר. */
  position:relative; z-index:2; flex:1; min-height:0;
  display:flex; flex-direction:column;
  padding:38mm 26mm 34mm;
}

/* ── כותרת עליונה ── */
.top, .bot { flex:0 0 auto; }
.top { text-align:center; }
.logo { width:74mm; height:auto; margin:0 auto; display:block; }
.brand {
  font-family:'Keter','Shofar',serif; font-weight:700; font-size:2.065em; color:var(--navy);
  letter-spacing:.01em;
}
.place {
  font-size:0.935em; color:var(--gold-d); letter-spacing:.3em;
  margin-top:1.8mm; font-weight:600;
}
.top .orn { margin:4.5mm auto 0; display:block; }

/* ── גוף ── */
.mid { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; }
/* לוחית הכותרת — הכתר, השם והנימוק יושבים יחד על רקע כהה.
   בגרסה הקודמת הכל צף על שמנת, והמודעה נראתה ריקה באמצע.
   הניגודיות היא מה שהופך אותה למודעה ולא למכתב. */
.plaque {
  margin-inline:6mm;
  background:linear-gradient(155deg, var(--navy3) 0%, var(--navy2) 55%, var(--navy) 100%);
  border:1.6px solid var(--gold); border-radius:2.4mm;
  padding:8mm 12mm 9mm; margin:0 0 8mm; position:relative;
  box-shadow:0 2mm 7mm rgba(14,27,49,.18);
}
.plaque::after {
  content:''; position:absolute; inset:1.6mm;
  border:.7px solid rgba(227,200,131,.42); border-radius:1.4mm; pointer-events:none;
}
.crest { margin:0 auto 3mm; display:block; max-height:26mm; width:auto; }

.eyebrow {
  font-size:0.983em; letter-spacing:.36em; color:var(--gold-l);
  font-weight:800; margin-bottom:3.5mm;
}

h1 {
  font-family:'Shofar','Keter',serif; font-weight:700; font-size:4.523em; line-height:1.14;
  margin-bottom:4mm;
  /* זהב מדורג על הכהה — כמו אותיות מוזהבות על שלט */
  background:linear-gradient(180deg, #F0DDAA 0%, #D9BC79 46%, #B08D3E 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
h1.long { font-size:4.413em; }
h1.mid-len { font-size:5.192em; }

.lead {
  font-family:'Keter','Shofar',serif; font-weight:700; font-size:1.868em;
  color:#EFE4CC; line-height:1.45; margin:0 auto; max-width:136mm;
}
.mid .orn { margin:0 auto 6mm; display:block; }

.body p {
  font-family:'Frank',serif; font-size:1.377em; line-height:1.85; color:var(--ink);
  max-width:142mm; margin:0 auto 4.5mm;
}
.body p:last-child { margin-bottom:0; }
.body p.strong {
  font-family:'Shofar',serif; font-weight:700; font-size:1.672em;
  color:var(--navy); line-height:1.6; margin-bottom:6mm;
}
/* חתימה — מודעת הודיה בלי חתימה נראית כמו טיוטה */
.sign {
  margin-top:9mm; font-family:'Drug',serif; font-size:1.475em;
  color:var(--gold-d); font-weight:700; letter-spacing:.02em;
}

/* לוחית התאריך — כמו חותם על המודעה */
.when {
  margin:9mm auto 0; display:inline-block; align-self:center;
  border:1.6px solid var(--gold); border-radius:1.6mm;
  padding:4.5mm 13mm; font-size:1.672em; font-weight:700; color:var(--navy);
  font-family:'Shofar',serif;
  background:linear-gradient(#fff, var(--cream2));
  box-shadow:0 1mm 3mm rgba(176,141,62,.14);
  letter-spacing:.02em;
}

/* ── לוח זמנים בבלוקים ── */
.plaque.tight { padding:4mm 9mm 5mm; margin-bottom:4.5mm; }
h1.zt { font-size:3.245em; margin-bottom:2mm; }
h1.zt em {
  font-style:normal; font-family:'Drug',serif;
  -webkit-text-fill-color:#E3C883; font-size:0.850em;
}
.plaque.tight .lead { font-size:1.278em; letter-spacing:.08em; }

.z-note {
  background:linear-gradient(#FFF9EC, #F6ECD6);
  border:1.4px solid var(--gold); border-inline-start:4px solid var(--gold);
  color:#6B4E12; border-radius:1.8mm; padding:3mm 7mm;
  font-family:'Frank',serif; font-size:1.180em; line-height:1.45;
  margin-bottom:4.5mm; text-align:center; font-weight:600;
}

.z-grid { display:grid; grid-template-columns:1fr 1fr; gap:4mm; }

.zb {
  border:1.3px solid var(--line); border-radius:2mm; overflow:hidden;
  background:rgba(255,255,255,.78); display:flex; flex-direction:column;
}
.zb.hl { border-color:var(--gold); border-width:1.8px; }

.zb-h {
  background:linear-gradient(150deg, var(--navy3), var(--navy));
  color:#F3E7C9; font-family:'Shofar',serif; font-weight:700; font-size:1.230em;
  padding:2.6mm 3mm 2.2mm; text-align:center; line-height:1.2;
}
.zb.hl .zb-h { background:linear-gradient(150deg, #7A5C1C, #4A3712); }
.zb-h span {
  display:block; font-family:'Asst',sans-serif; font-weight:600;
  font-size:0.935em; color:var(--gold-l); letter-spacing:.1em; margin-top:1.2mm;
}

.z-row {
  display:flex; align-items:baseline; gap:2mm;
  padding:1.7mm 3.6mm; border-bottom:1px dotted var(--line);
  font-size:1.032em;
}
.z-row:last-of-type { border-bottom:0; }
.z-row span { flex:1; color:var(--ink); }
/* נקודות מובילות — מה שהופך רשימת זמנים ללוח ולא לרשימת מכולת */
.z-row span::after {
  content:''; display:inline-block; width:0; }
.z-row.em { background:rgba(176,141,62,.10); }
.z-row.em span { font-weight:800; color:var(--navy); }

.z-v {
  font-family:'Num','Asst',sans-serif; font-weight:900; font-size:1.230em;
  color:var(--navy); white-space:nowrap;
}
.z-v.big { font-size:1.425em; color:#7A5C1C; }
.z-nt {
  font-style:normal; font-size:0.935em; color:#8A5A16; font-weight:700;
  text-align:end; max-width:34mm; line-height:1.35;
}
/* קו למילוי ביד — זמן תפילה שטרם נקבע */
.z-fill {
  display:inline-block; width:22mm; border-bottom:1.4px solid var(--gold);
  opacity:.7; margin-bottom:1mm;
}
.z-warn {
  margin-top:auto; background:rgba(155,30,30,.07);
  border-top:1px solid rgba(155,30,30,.25);
  color:#8E2020; font-weight:800; font-size:1.032em;
  padding:2mm 3mm; text-align:center;
}
.foot-note {
  margin-top:3.5mm; font-size:0.846em; color:var(--muted); line-height:1.5;
  text-align:center; font-family:'Frank',serif;
}

/* ── תחתית ── */
/* התחתית יוצאת מזרימת ה-flex ומקובעת על מרכז הסגלגל שבמסגרת.
   בזרימה היא נדדה לפי גובה התוכן — «גוט שבת» נחת בין 1085 ל-1123
   לפי המודעה, ובחלקן מתחת לסגלגל לגמרי. */
.bot {
  position:absolute; left:0; right:0; bottom:10mm; z-index:6;
  text-align:center; padding-top:0;
}
.bot .orn { margin:0 auto 2.5mm; display:block; }
.bot .slogan {
  font-family:'Keter','Shofar',serif; font-size:1.868em; color:var(--navy); font-weight:700;
  letter-spacing:.01em;
}
.foot-row {
  display:flex; align-items:center; justify-content:center; gap:6mm;
  margin-top:2.4mm;
}
.yishuv { width:26mm; height:auto; display:block; opacity:.72; }
.bot .site {
  font-size:0.885em; color:var(--muted); letter-spacing:.14em;
}
.seal { position:absolute; bottom:-2mm; inset-inline-end:2mm; opacity:.5; }

/* ── כיול לגובה העמוד ─────────────────────────────────────────────
   נמדד ב-Chrome: לוח הזמנים גלש ב-240px מתוך 1123. הכיול נעשה כאן
   בבלוק אחד ולא בפיזור על כל הכלל, כדי שאפשר יהיה לכוונן אותו שוב
   בלי לפרק את העיצוב. אחרי כל שינוי תוכן — למדוד מחדש. */
.inner { padding:10mm 13mm 16mm; }
.logo { width:60mm; }
.brand { font-size:1.672em; }
.top .orn { margin:1.8mm auto 0; }

.plaque.tight { padding:2.2mm 7mm 2.6mm; margin-bottom:2.4mm; }

h1.zt { font-size:2.163em; margin-bottom:1mm; }
.plaque.tight .lead { font-size:1.082em; }

.z-note { padding:1.8mm 6mm; font-size:0.964em; line-height:1.34; margin-bottom:2.4mm; }
.z-grid { gap:2.8mm; }
.zb-h { font-size:1.082em; padding:1.8mm 2.5mm 1.5mm; }
.zb-h span { font-size:0.806em; margin-top:.6mm; }
.z-row { padding:.85mm 3mm; font-size:0.905em; }
.z-v { font-size:1.082em; }
.z-v.big { font-size:1.219em; }
.z-nt { font-size:0.826em; max-width:30mm; }
.z-fill { width:19mm; }
.z-warn { font-size:0.885em; padding:1.3mm 3mm; }
.foot-note { margin-top:2.2mm; font-size:0.767em; line-height:1.45; }

.bot { padding-top:1.6mm; }
.bot .orn { margin:0 auto 1.2mm; }
.bot .slogan { font-size:1.475em; }
.bot .site { font-size:0.787em; }
.yishuv { width:21mm; }
.foot-row { gap:4.5mm; margin-top:1.2mm; }

/* מודעות ההודיה נכנסות בקלות; רק הקידוש חרג במעט */
.body p { font-size:1.180em; line-height:1.72; margin-bottom:3mm; }
.body p.strong { font-size:1.425em; margin-bottom:3.8mm; }
.sign { margin-top:5mm; font-size:1.377em; }

/* ── מילוי העמוד ───────────────────────────────────────────────────
   נמדד: 44% מגובה העמוד היה אוויר, והמודעה «צפה» באמצע עם חורים
   של 250px למעלה ולמטה. הטיפול הוא הגדלה אמיתית של התוכן ולא פיזור
   רווחים — מודעה על לוח נקראת ממרחק שני מטר. */
.mid { justify-content:flex-start; padding-top:2mm; }

.plaque { padding:9mm 12mm 10mm; margin-bottom:9mm; }

.eyebrow { font-size:1.130em; letter-spacing:.4em; margin-bottom:5mm; }
h1 { font-size:4.523em; margin-bottom:5mm; }
h1.long { font-size:4.413em; }
h1.mid-len { font-size:5.192em; }
.lead { font-size:2.065em; line-height:1.42; }

.body p { font-size:1.525em; line-height:1.8; margin-bottom:5.5mm; max-width:150mm; }
.body p.strong { font-size:1.820em; line-height:1.6; margin-bottom:7mm; }
.when { margin-top:11mm; padding:5mm 14mm; font-size:1.868em; }
.sign { margin-top:9mm; font-size:1.573em; }

/* לוח הזמנים ממלא ממילא — לו רק הגדלה מתונה */
.plaque.tight { padding:3.4mm 8mm 4mm; margin-bottom:4mm; }

h1.zt { font-size:2.655em; margin-bottom:1.6mm; }
.plaque.tight .lead { font-size:1.278em; }
.z-note { padding:2.6mm 7mm; font-size:1.121em; margin-bottom:3.4mm; }
.z-grid { gap:3.4mm; }
.zb-h { font-size:1.230em; padding:2.2mm 3mm 1.9mm; }
.zb-h span { font-size:0.885em; }
.z-row { padding:1.35mm 3.4mm; font-size:1.042em; }
.z-v { font-size:1.219em; }
.z-v.big { font-size:1.377em; }
.z-nt { font-size:0.885em; }
.z-warn { font-size:0.983em; padding:1.8mm 3mm; }
.foot-note { font-size:0.846em; margin-top:3mm; }

/* בעלי התפילה — רוחב מלא מתחת לרשת הימים, כי אלה שמות ולא שעות
   ושורה צרה הייתה שוברת אותם. */
.zb.tf { margin-top:3mm; }
/* שש שורות בעמודה אחת דחפו את הסקלר של הלוח ל-0.40 והפכו את כל
   הזמנים לבלתי קריאים. שתי עמודות חוסכות חצי גובה. */
.zb.tf .tf-grid { display:grid; grid-template-columns:1fr 1fr; }
.zb.tf .z-row { border-bottom:1px dotted var(--line); }
.zb.tf .tf-grid > .z-row:nth-child(odd) { border-inline-end:1px dotted var(--line); }
.zb.tf .zb-h { background:linear-gradient(150deg,#7A4B2E,#3E2416); }
.z-v.nm {
  font-family:'Shofar','Frank',serif; font-weight:700; font-size:1.02em;
  color:var(--navy2); white-space:normal; text-align:end;
}

/* ── מסלולי תרומה ── */
.tracks {
  display:grid; grid-template-columns:repeat(3,1fr); gap:3mm;
  margin:6mm auto 0; max-width:132mm;
}
.trk {
  border:1.3px solid var(--gold); border-radius:2mm; padding:3.4mm 2mm 3.8mm;
  background:linear-gradient(#FFFDF7,#F6EEDD); text-align:center;
  display:flex; flex-direction:column; gap:1mm;
}
.trk.hl {
  border-width:2px;
  background:linear-gradient(155deg,var(--navy3),var(--navy2) 60%,var(--navy));
  box-shadow:0 1mm 3mm rgba(42,20,22,.28);
}
.trk b {
  font-family:'Shofar',serif; font-weight:700; font-size:1.18em; color:var(--navy2);
}
.trk.hl b { color:#F2E2BC; }
.trk .amt {
  font-family:'Num','Asst',sans-serif; font-weight:900; font-size:1.42em;
  color:#7A5C1C; line-height:1.15;
}
.trk.hl .amt { color:#EAD49A; }
.trk .ds { font-size:.80em; color:var(--muted); line-height:1.35; }
.trk.hl .ds { color:#D8C9AC; }

/* ── QR ── */
.qr {
  display:flex; align-items:center; justify-content:center; gap:5mm;
  margin:6mm auto 0; padding:3mm 6mm; max-width:118mm;
  border:1.2px solid var(--gold); border-radius:2mm;
  background:rgba(255,255,255,.62);
}
.qr img { width:24mm; height:24mm; display:block; }
.qr div { text-align:start; }
.qr b {
  display:block; font-family:'Shofar',serif; font-weight:700;
  font-size:1.12em; color:var(--navy2);
}
.qr span { font-size:.82em; color:var(--muted); }

/* ── רשימת השמות במודעה הכללית ── */
.roll { margin:5mm auto 0; max-width:140mm; text-align:start; }
.rh {
  font-family:'Shofar',serif; font-weight:700; font-size:1.10em;
  color:var(--gold-d); text-align:center; letter-spacing:.16em;
  margin-bottom:3mm;
}
.pr {
  display:flex; align-items:baseline; gap:3mm;
  padding:2.1mm 3mm; border-bottom:1px dotted var(--line);
}
.pr:last-child { border-bottom:0; }
.pr b {
  font-family:'Shofar',serif; font-weight:700; font-size:1.16em;
  color:var(--navy2); white-space:nowrap;
}
.pr span { font-size:.90em; color:#5A4F3E; line-height:1.4; flex:1; text-align:end; }
p.close {
  font-family:'Frank',serif; font-size:1.02em; line-height:1.72;
  color:var(--ink); max-width:136mm; margin:4.6mm auto 0; text-align:center;
}

/* לוגו שותף בתחתית — בית הכנסת המרכזי או «חלקי בקהילתי», לפי
   הווריאנט. יושב מתחת לברכה ובתוך הסגלגל שבמסגרת. */
.colog {
  position:absolute; left:0; right:0; bottom:34mm; z-index:6;
  display:flex; align-items:center; justify-content:center; gap:8mm;
}
.colog:empty { display:none; }
/* שני לוגואים זה לצד זה — כשמופיעים יחד כל אחד מוקטן כדי שהשורה
   תישאר מאוזנת ולא תגלוש אל הסגלגל. */
.colog.both img { width:26mm; }
.colog.both img.keh { width:34mm; }
.colog img { height:auto; display:block; opacity:.88; }
.colog.zech img { width:30mm; }
.colog.keh img  { width:40mm; }

/* גופן חלופי: דרוגולין לכותרות — דפוס עברי מסורתי, אותיות רחבות
   וסימטריות יותר מ«שופר». */
body.alt h1 { font-family:'Drug','Shofar',serif; }
body.alt .lead { font-family:'Keter','Drug',serif; font-size:1.16em; }
body.alt .pr b { font-family:'Drug',serif; }
body.alt .slogan { font-family:'Drug',serif; }

.tracks:has(.trk:nth-child(2):last-child) {
  grid-template-columns:1fr 1fr; max-width:112mm; gap:5mm;
}
.tracks:has(.trk:nth-child(2):last-child) .trk { padding:5mm 3mm 5.6mm; }
.tracks:has(.trk:nth-child(2):last-child) .amt { font-size:2.3em; }
.tracks:has(.trk:nth-child(2):last-child) b { font-size:1.42em; }

/* לוח זמנים עם 4 בלוקים מלאים (ראש השנה) — התוכן הארוך ביותר
   מבין כל סוגי המודעה, וה"מילוי העמוד" הכללי שמעליו הגדיל את
   ה-z-* עד שהבלוק הרביעי גלש מתחת ל-297mm וממש מתחת ל-.bot
   שמקובע absolute. נמדד בפועל: השורה האחרונה (מנחה/שקיעה)
   נבלעה מאחורי «גוט שבת». הקטנה ממוקדת רק למקרה של 4 בלוקים,
   כדי שלא לגעת בגרסת זמנים קצרה יותר. */
.z-grid:has(.zb:nth-child(4)) { gap:2.4mm; }
.z-grid:has(.zb:nth-child(4)) .zb-h { font-size:0.98em; padding:1.5mm 2.2mm 1.2mm; }
.z-grid:has(.zb:nth-child(4)) .zb-h span { font-size:0.76em; margin-top:.4mm; }
.z-grid:has(.zb:nth-child(4)) .z-row { padding:.85mm 2.6mm; font-size:0.86em; }
.z-grid:has(.zb:nth-child(4)) .z-v { font-size:0.98em; }
.z-grid:has(.zb:nth-child(4)) .z-v.big { font-size:1.08em; }
.z-grid:has(.zb:nth-child(4)) .z-nt { font-size:0.78em; max-width:27mm; }
.z-grid:has(.zb:nth-child(4)) .z-warn { font-size:0.80em; padding:1mm 2mm; }
.mid:has(.z-grid .zb:nth-child(4)) .zb.tf { margin-top:1.6mm; }
.mid:has(.z-grid .zb:nth-child(4)) .zb.tf .z-row { padding:.7mm 2.6mm; font-size:0.80em; }
.mid:has(.z-grid .zb:nth-child(4)) .zb.tf .zb-h { font-size:0.98em; padding:1.5mm 2.2mm 1.2mm; }
.mid:has(.z-grid .zb:nth-child(4)) .foot-note { margin-top:1.6mm; font-size:0.70em; }
</style>
</head>

  </div>
