<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מודעה</title>
<style>
/* מודעת שער — המבנה נלמד מתבניות מסחריות בקטגוריית בתי כנסת:
   רקע כהה עם ויניטה, עמודים בצדדים, קשת למעלה, ופנל בהיר מוגבה
   שנושא את הטקסט. הגרסאות הקודמות היו קווי זהב דקים על קרם —
   נקי, אבל בשפה של הזמנה אירופית ולא של מודעה על לוח בבית כנסת.
   מה שעושה שם את הרושם הוא נפח, ושלושת מקורותיו — רקע כהה, פנל
   מוגבה ועמודים מוצללים — ניתנים לציור ב-SVG.

   כל הנכסים מקומיים ומוטמעים כ-data URI: הרינדור רץ ב-headless
   בלי רשת, וכל קובץ חיצוני היה נעלם בשקט. */

@font-face { font-family:'Keter';  src:url('fonts/keteryg-bold-fixed.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Keter';  src:url('fonts/keteryg-medium-webfont.ttf') format('truetype'); font-weight:500; }
@font-face { font-family:'Shofar'; src:url('fonts/shofardemi-bold-webfont.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Drug';   src:url('fonts/drugulinclm-bold-webfont.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Frank'; src:url('../fonts/frank-medium.woff2') format('woff2'); font-weight:500; }
@font-face { font-family:'Frank'; src:url('../fonts/frank-black.woff2') format('woff2'); font-weight:900; }
@font-face { font-family:'Asst';  src:url('../fonts/assistant-regular.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'Asst';  src:url('../fonts/assistant-semibold.woff2') format('woff2'); font-weight:600; }
@font-face { font-family:'Asst';  src:url('../fonts/assistant-extrabold.woff2') format('woff2'); font-weight:800; }
@font-face { font-family:'Num';   src:url('../fonts/heebo-black.woff2') format('woff2'); font-weight:900; }

:root {
  --navy:#0B1526; --navy2:#16294A; --navy3:#1E3763;
  --gold:#B08D3E; --gold-l:#EAD49A; --gold-d:#7A5C1C;
  --paper:#FDFBF6; --paper2:#F4EDDE;
  --line:#DCCEB4; --muted:#6F6555; --ink:#2E2A22;
}
* { box-sizing:border-box; margin:0; padding:0; }
@page { size:A4 portrait; margin:0; }
html,body { width:210mm; height:297mm; }

body {
  font-family:'Asst',sans-serif; color:var(--ink); position:relative; overflow:hidden;
  /* ויניטה: אור מאחורי הפנל, חושך בפינות. בלי זה הרקע נראה כמו
     מלבן צבוע ולא כמו עומק. */
  background:
    radial-gradient(56% 42% at 50% 40%, rgba(126,168,228,.22) 0%, rgba(11,21,38,0) 64%),
    radial-gradient(122% 100% at 50% 36%, #24406F 0%, #16294A 40%, #0B1526 76%, #050A14 100%);
}

/* ── השער ── */
.col {
  position:absolute; top:20mm; height:244mm; width:20mm; z-index:2;
  filter:drop-shadow(0 2mm 3mm rgba(0,0,0,.5));
}
.col-r { right:6.5mm; }
.col-l { left:6.5mm; }
.arch {
  position:absolute; top:6mm; left:50%; transform:translateX(-50%);
  width:186mm; z-index:1; filter:drop-shadow(0 1.6mm 2.4mm rgba(0,0,0,.55));
}
.base {
  position:absolute; bottom:6mm; left:50%; transform:translateX(-50%);
  width:96mm; z-index:3; filter:drop-shadow(0 1.2mm 2mm rgba(0,0,0,.5));
}

/* ── הפנל ── */
.panel {
  font-size:1em;
  position:absolute; inset:31mm 29mm 31mm; z-index:4;
  display:flex; flex-direction:column; padding:10mm 12mm 8mm;
  background:radial-gradient(120% 72% at 50% 6%, #FFFFFF 0%, var(--paper) 44%, var(--paper2) 100%);
  border:1.4px solid var(--gold); border-radius:4mm 4mm 2mm 2mm;
  box-shadow:0 0 0 1.3mm rgba(176,141,62,.18), 0 3mm 9mm rgba(0,0,0,.45);
  overflow:hidden;
}
.panel::before {
  content:''; position:absolute; inset:2.2mm;
  border:.8px solid rgba(176,141,62,.42); border-radius:3mm 3mm 1.4mm 1.4mm;
  pointer-events:none;
}
.pc { position:absolute; width:12mm; z-index:5; }
.pc-tr { top:1.2mm; right:1.2mm; }
.pc-tl { top:1.2mm; left:1.2mm; transform:scaleX(-1); }
.pc-br { bottom:1.2mm; right:1.2mm; transform:scaleY(-1); }
.pc-bl { bottom:1.2mm; left:1.2mm; transform:scale(-1,-1); }

/* ── ראש ── */
.top { text-align:center; position:relative; z-index:6; }
.logo { width:54mm; height:auto; margin:0 auto; display:block; }
.top .orn { margin:2.4mm auto 0; display:block; width:38mm; }

/* ── גוף ── */
.mid {
  /* min-height:0 הכרחי: בלעדיו פריט flex לא מתכווץ מתחת לגובה
     התוכן שלו, ו-.mid דחף את התחתית אל מחוץ לפנל — הלוגו והכתובת
     יצאו אל הרקע הכהה ונעלמו שם. */
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; justify-content:center;
  text-align:center; position:relative; z-index:6;
}
.top, .bot { flex:0 0 auto; }
.crest { margin:0 auto 3mm; display:block; }
.eyebrow {
  font-size:0.917em; letter-spacing:.4em; color:var(--gold-d);
  font-weight:800; margin-bottom:3.4mm;
}
h1 {
  font-family:'Keter','Shofar',serif; font-weight:700; font-size:3.500em; line-height:1.13;
  margin-bottom:3.4mm; color:var(--navy2);
  text-shadow:0 .4mm 0 rgba(176,141,62,.2);
}
h1.long { font-size:2.583em; }
h1.mid-len { font-size:3.000em; }
.lead {
  font-family:'Shofar',serif; font-weight:700; font-size:1.500em;
  color:var(--gold-d); line-height:1.4; margin:0 auto 4.6mm; max-width:128mm;
}
.mid .orn { margin:0 auto 4.6mm; display:block; width:50mm; }

.body p {
  font-family:'Frank',serif; font-size:1.100em; line-height:1.78; color:var(--ink);
  max-width:134mm; margin:0 auto 3.4mm;
}
.body p:last-child { margin-bottom:0; }
.body p.strong {
  font-family:'Shofar',serif; font-weight:700; font-size:1.292em;
  color:var(--navy2); line-height:1.52; margin-bottom:4.4mm;
}
.sign {
  margin-top:5.6mm; font-family:'Drug',serif; font-size:1.250em;
  color:var(--gold-d); font-weight:700;
}
.when {
  margin:6.6mm auto 0; display:inline-block; align-self:center;
  border:1.5px solid var(--gold); border-radius:1.6mm;
  padding:3.6mm 11mm; font-family:'Shofar',serif; font-size:1.333em;
  font-weight:700; color:var(--navy2);
  background:linear-gradient(#fff,#F3EADA);
  box-shadow:0 1mm 2.4mm rgba(176,141,62,.22);
}

/* ── לוח זמנים ── */
.plaque {
  background:linear-gradient(155deg,var(--navy3) 0%,var(--navy2) 58%,var(--navy) 100%);
  border:1.5px solid var(--gold); border-radius:2.4mm;
  padding:4mm 8mm 4.6mm; margin:0 0 4mm; position:relative;
  box-shadow:0 1.6mm 5mm rgba(0,0,0,.32);
}
.plaque::after {
  content:''; position:absolute; inset:1.5mm;
  border:.7px solid rgba(234,212,154,.45); border-radius:1.4mm;
}
.plaque .eyebrow { color:var(--gold-l); }
.plaque h1 {
  color:transparent; text-shadow:none;
  background:linear-gradient(180deg,#F5E4B8 0%,#D9BC79 48%,#B08D3E 100%);
  -webkit-background-clip:text; background-clip:text;
}
.plaque .lead { color:#E9DCC0; margin-bottom:0; }
h1.zt { font-size:2.167em; margin-bottom:1.4mm; }
.plaque .crest { width:32mm !important; margin-bottom:2mm; }

.z-note {
  background:linear-gradient(#FFFBF1,#F4E9D3);
  border:1.3px solid var(--gold); border-inline-start:4px solid var(--gold);
  color:#6B4E12; border-radius:1.8mm; padding:2.3mm 6mm;
  font-family:'Frank',serif; font-size:0.900em; line-height:1.38;
  margin-bottom:3.2mm; text-align:center; font-weight:600;
}
.z-grid { display:grid; grid-template-columns:1fr 1fr; gap:3mm; }
.zb {
  border:1.2px solid var(--line); border-radius:2mm; overflow:hidden;
  background:rgba(255,255,255,.92); display:flex; flex-direction:column;
}
.zb.hl { border-color:var(--gold); border-width:1.6px; }
.zb-h {
  background:linear-gradient(150deg,var(--navy3),var(--navy));
  color:#F3E7C9; font-family:'Shofar',serif; font-weight:700; font-size:0.967em;
  padding:2mm 3mm 1.7mm; text-align:center; line-height:1.2;
}
.zb.hl .zb-h { background:linear-gradient(150deg,#8A6B24,#4A3712); }
.zb-h span {
  display:block; font-family:'Asst',sans-serif; font-weight:600;
  font-size:0.700em; color:var(--gold-l); letter-spacing:.08em; margin-top:.6mm;
}
.z-row {
  display:flex; align-items:baseline; gap:2mm;
  padding:1.15mm 3.2mm; border-bottom:1px dotted var(--line); font-size:0.825em;
}
.z-row:last-of-type { border-bottom:0; }
.z-row span { flex:1; color:var(--ink); }
.z-row.em { background:rgba(176,141,62,.12); }
.z-row.em span { font-weight:800; color:var(--navy2); }
.z-v {
  font-family:'Num','Asst',sans-serif; font-weight:900; font-size:0.967em;
  color:var(--navy2); white-space:nowrap;
}
.z-v.big { font-size:1.083em; color:#7A5C1C; }
.z-nt { font-style:normal; font-size:0.717em; color:#8A5A16; font-weight:700; text-align:end; max-width:29mm; line-height:1.3; }
.z-fill { display:inline-block; width:18mm; border-bottom:1.4px solid var(--gold); opacity:.7; margin-bottom:1mm; }
.z-warn {
  margin-top:auto; background:rgba(155,30,30,.08);
  border-top:1px solid rgba(155,30,30,.26);
  color:#8E2020; font-weight:800; font-size:0.783em;
  padding:1.4mm 3mm; text-align:center;
}
.foot-note { margin-top:2.4mm; font-size:0.667em; color:var(--muted); line-height:1.44; text-align:center; font-family:'Frank',serif; }

/* ── תחתית הפנל ── */
.bot { text-align:center; padding-top:2.2mm; position:relative; z-index:6; }
.bot .orn { margin:0 auto 1.4mm; display:block; width:54mm; }
.bot .slogan { font-family:'Keter','Shofar',serif; font-size:1.292em; color:var(--navy2); font-weight:700; }
.foot-row { display:flex; align-items:center; justify-content:center; gap:5mm; margin-top:1.4mm; }
.yishuv { width:20mm; height:auto; display:block; opacity:.78; }
.bot .site { font-size:0.683em; color:var(--muted); letter-spacing:.13em; }
</style>
</head>
<body>

<img class="arch" src="ARCH" alt="">
<img class="col col-r" src="COLUMN" alt="">
<img class="col col-l" src="COLUMN" alt="">
<img class="base" src="BASEORN" alt="">

<div class="panel">
  <img class="pc pc-tr" src="CORNER" alt="">
  <img class="pc pc-tl" src="CORNER" alt="">
  <img class="pc pc-br" src="CORNER" alt="">
  <img class="pc pc-bl" src="CORNER" alt="">

  <div class="top">
    <img class="logo" src="logo-h.svg" alt="מניין הצעירים · מעלה עמוס">
    <img class="orn" src="RULE" alt="">
  </div>

  <div class="mid" id="mid"></div>

  <div class="bot">
    <img class="orn" src="DIVIDER" alt="">
    <div class="slogan" id="slogan">שנה טובה ומבורכת</div>
    <div class="foot-row">
      <img class="yishuv" src="yishuv.svg" alt="מעלה עמוס">
      <span class="site">minyan.mokad.co.il</span>
    </div>
  </div>
</div>

</body>
</html>
